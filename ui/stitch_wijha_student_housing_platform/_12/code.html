<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "text-muted": "#6B7280", "outline-variant": "#bdc9c6", "surface-bright": "#f8f9ff", "primary-fixed": "#9cf2e8", "inverse-on-surface": "#eaf1ff", "on-primary-fixed": "#00201d", "background": "#f8f9ff", "on-secondary-container": "#753019", "surface": "#FFFFFF", "tertiary-fixed-dim": "#7ed7bf", "primary": "#005c55", "outline": "#6e7977", "on-error-container": "#93000a", "on-secondary-fixed-variant": "#77311a", "on-background": "#121c2a", "status-pending": "#E0A100", "secondary-container": "#fc9a7b", "tertiary-fixed": "#9af3da", "secondary": "#95482f", "page-bg": "#F4FBF9", "primary-container": "#0f766e", "surface-container": "#e6eeff", "surface-variant": "#d9e3f6", "status-approved": "#2E9E6B", "status-rejected": "#C0392B", "surface-container-low": "#eff4ff", "surface-tint": "#006a63", "on-tertiary": "#ffffff", "tertiary-container": "#0b7763", "surface-dim": "#d0dbed", "secondary-fixed": "#ffdbd0", "error-container": "#ffdad6", "secondary-fixed-dim": "#ffb59e", "surface-container-highest": "#d9e3f6", "inverse-primary": "#80d5cb", "tertiary": "#005c4c", "primary-fixed-dim": "#80d5cb", "on-surface-variant": "#3e4947", "on-tertiary-container": "#a1fbe2", "on-tertiary-fixed": "#002019", "border-subtle": "#D6E4E0", "surface-container-high": "#dee9fc", "on-tertiary-fixed-variant": "#005142", "error": "#ba1a1a", "on-primary": "#ffffff", "surface-container-lowest": "#ffffff", "on-surface": "#121c2a", "on-primary-fixed-variant": "#00504a", "on-secondary-fixed": "#3a0b00", "on-primary-container": "#a3faef", "inverse-surface": "#27313f", "on-secondary": "#ffffff", "on-error": "#ffffff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-lg": "1.5rem", "margin-mobile": "1rem", "gutter-mobile": "1rem", "space-sm": "0.75rem", "space-xl": "2rem", "gutter": "1.5rem", "space-md": "1rem", "margin": "2rem", "space-xs": "0.5rem" }, fontFamily: { "label-md": ["Plus Jakarta Sans"], "headline-lg-mobile": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "caption": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "headline-xl-mobile": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"] }, fontSize: { "label-md": ["14px", { lineHeight: "22px", fontWeight: "600" }], "headline-lg-mobile": ["20px", { lineHeight: "34px", fontWeight: "700" }], "body-sm": ["14px", { lineHeight: "24px", fontWeight: "400" }], "caption": ["13px", { lineHeight: "22px", fontWeight: "400" }], "label-sm": ["12px", { lineHeight: "18px", fontWeight: "500" }], "headline-xl": ["32px", { lineHeight: "54px", fontWeight: "700" }], "body-lg": ["16px", { lineHeight: "28px", fontWeight: "400" }], "headline-xl-mobile": ["28px", { lineHeight: "48px", fontWeight: "700" }], "headline-sm": ["18px", { lineHeight: "30px", fontWeight: "600" }], "headline-lg": ["22px", { lineHeight: "38px", fontWeight: "700" }] } } } };</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-page-bg text-on-surface flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-page-bg"><div class="flex flex-col w-full px-margin-mobile pb-space-xl">
<!-- Minimal Clean Header -->
<header class="flex items-center justify-between py-space-sm">
<button aria-label="العودة للرئيسية" class="w-10 h-10 rounded-full bg-surface shadow-sm flex items-center justify-center text-on-surface-variant active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<div class="flex items-center justify-center"><img alt="شعار وجهة" class="h-12 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_b1kyJvnucZr2naYTpIWOqFQ0Cwj6QidL3phZSimpszNMhMJs2-keZyixhFtyVX6VBz4g6f4jzNAFhBJ4EWnb7Jy-47KB4mBQUNnhWyQrlAeZFQwjsuvREIGfXUUp-xssUeZjFTF8n3EcUYUB2d0TqrSNZw-M-iePiLVi_ue4Qer9UEUwlEiiKJeesexGfx4CTp8iwgGUMqvO86H6ntUxJ8N17bI9NQpjX6__NqAQbW4JFUaiyFi9"></div>
<div class="w-10 h-10"></div>
</header>
<!-- Welcoming Section -->
<div class="mt-space-md mb-space-lg text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight mb-1.5">
      أهلاً بك مجدداً في وجهة 👋
    </h1>
<p class="font-body-sm text-body-sm text-text-muted max-w-xs mx-auto">
      سجّل دخولك لمتابعة حجوزاتك والتواصل مع مالك السكن
    </p>
</div>
<!-- Role Selector Segment -->
<div class="bg-surface-variant/40 p-1 rounded-xl flex items-center mb-space-lg shadow-sm">
<button class="flex-1 py-2.5 rounded-lg font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-200 bg-surface text-primary shadow-sm" id="role-student" onclick="selectRole('student')" type="button">
<span class="material-symbols-outlined text-[18px]">school</span>
<span class="">طالب</span>
</button>
<button class="flex-1 py-2.5 rounded-lg font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-200 text-text-muted hover:text-on-surface" id="role-owner" onclick="selectRole('owner')" type="button">
<span class="material-symbols-outlined text-[18px]">real_estate_agent</span>
<span class="">مالك سكن</span>
</button>
</div>
<!-- One-Tap Social & University Quick Login -->
<div class="flex flex-col gap-2.5 mb-space-lg">
<!-- Google Login Button -->
<button class="w-full h-12 bg-surface rounded-xl shadow-sm flex items-center justify-center gap-3 active:scale-[0.99] transition-all" type="button">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface">المتابعة بحساب Google</span>
</button>
<!-- University Email Login Button -->
<button class="w-full h-12 bg-surface rounded-xl shadow-sm flex items-center justify-center gap-3 active:scale-[0.99] transition-all" type="button">
<div class="w-5 h-5 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed">
<span class="material-symbols-outlined text-[14px]">local_library</span>
</div>
<span class="font-label-md text-label-md text-on-surface">المتابعة بالبريد الجامعي</span>
</button>
</div>
<!-- Visual Separator -->
<div class="relative flex items-center justify-center mb-space-lg">
<div class="w-full h-[1px] bg-surface-variant"></div>
<span class="absolute px-3 bg-page-bg font-caption text-caption text-text-muted">أو بالبريد / الهاتف</span>
</div>
<!-- Interactive Credentials Form -->
<form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
<!-- Identifier Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant font-medium" for="user-id">البريد الإلكتروني أو رقم الهاتف</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-3 text-text-muted text-[20px] pointer-events-none">alternate_email</span>
<input class="w-full h-12 pr-10 pl-4 bg-surface rounded-xl font-body-sm text-body-sm text-on-surface placeholder:text-text-muted/60 shadow-sm focus:outline-none focus:bg-surface-bright transition-all" id="user-id" placeholder="student@univ.edu.eg أو 01xxxxxxxxx" type="text">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-sm text-label-sm text-on-surface-variant font-medium" for="password">كلمة المرور</label>
<a class="font-caption text-caption text-primary hover:underline" href="javascript:void(0)">نسيت كلمة المرور؟</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-3 text-text-muted text-[20px] pointer-events-none">lock</span>
<input class="w-full h-12 pr-10 pl-11 bg-surface rounded-xl font-body-sm text-body-sm text-on-surface placeholder:text-text-muted/60 shadow-sm focus:outline-none focus:bg-surface-bright transition-all" id="password" placeholder="••••••••" type="password">
<button aria-label="إظهار أو إخفاء كلمة المرور" class="absolute left-3 text-text-muted hover:text-on-surface flex items-center justify-center p-1" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me Checkbox -->
<div class="flex items-center gap-2 mt-0.5 mb-2 cursor-pointer select-none" onclick="toggleRemember()">
<div class="w-5 h-5 rounded-md bg-surface shadow-sm flex items-center justify-center transition-all" id="remember-box">
<span class="material-symbols-outlined text-[16px] text-surface hidden" id="remember-check">check</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">تذكر تسجيل دخولي على هذا الجهاز</span>
</div>
<!-- Primary Action Button -->
<button class="w-full h-12 bg-primary-container text-on-primary rounded-xl font-label-md text-label-md shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-1" type="submit">
<span class="">تسجيل الدخول</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
<!-- Sign-Up Prompt -->
<div class="mt-space-lg text-center">
<p class="font-body-sm text-body-sm text-text-muted">
      طالب جديد؟ 
      <a class="font-label-md text-label-md text-primary font-semibold hover:underline mr-1" href="javascript:void(0)">
        أنشئ حسابك الآن مجاناً
      </a>
</p>
</div>
<!-- Reassurance & Trust Badge -->
<div class="mt-space-xl p-3.5 bg-surface rounded-xl shadow-sm flex items-center gap-3">
<div class="w-9 h-9 rounded-full bg-status-approved/10 flex items-center justify-center text-status-approved shrink-0">
<span class="material-symbols-outlined text-[20px]">verified_user</span>
</div>
<div class="flex flex-col min-w-0">
<p class="font-label-sm text-label-sm text-on-surface font-semibold truncate">ضمان وحماية 100%</p>
<p class="font-caption text-caption text-text-muted leading-tight">حجوزاتك ومدفوعاتك محمية بضمان وجهة المعتمد للطلاب.</p>
</div>
</div>
</div>
<script>
  function selectRole(role) {
    const studentBtn = document.getElementById('role-student');
    const ownerBtn = document.getElementById('role-owner');
    
    if (role === 'student') {
      studentBtn.className = "flex-1 py-2.5 rounded-lg font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-200 bg-surface text-primary shadow-sm";
      ownerBtn.className = "flex-1 py-2.5 rounded-lg font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-200 text-text-muted hover:text-on-surface";
    } else {
      ownerBtn.className = "flex-1 py-2.5 rounded-lg font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-200 bg-surface text-primary shadow-sm";
      studentBtn.className = "flex-1 py-2.5 rounded-lg font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-200 text-text-muted hover:text-on-surface";
    }
  }

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    const pwdIcon = document.getElementById('pwd-icon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      pwdIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      pwdIcon.textContent = 'visibility';
    }
  }

  let rememberChecked = false;
  function toggleRemember() {
    rememberChecked = !rememberChecked;
    const box = document.getElementById('remember-box');
    const check = document.getElementById('remember-check');
    if (rememberChecked) {
      box.classList.remove('bg-surface');
      box.classList.add('bg-primary');
      check.classList.remove('hidden');
    } else {
      box.classList.remove('bg-primary');
      box.classList.add('bg-surface');
      check.classList.add('hidden');
    }
  }
</script></main>

</body></html>
